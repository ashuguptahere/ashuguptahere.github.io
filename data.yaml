# Resume data. Pure data only - no markup, no template syntax.
#
# Rendered to PDF by resume.typ and to README.md by yaml_to_md.py.
# Sections appear here in the same order they appear in both outputs.
#
# Shapes, used consistently across every section:
#   * a linkable entry is   name / url (optional) / detail (optional)
#     - used by projects, achievements and certifications
#   * a plain statement is  a single string
#     - used by experience bullets, leadership and activities
#   * a dated entry is      organisation / location / role / dates
#     - used by experience and education

