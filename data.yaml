# Resume data. Rendered to PDF by resume.typ (Typst) and to README.md by
# yaml_to_md.py.
# Notes:
# - Prose fields (bullets, tail, line, items under achievements/leadership)
#   hold Typst markup: *bold*, _italic_, #link("url")[text], #h(1fr).
#   yaml_to_md.py translates that same markup to Markdown.
# - Every other field is plain text and is inserted verbatim, so characters
#   like # (C#) and & are never parsed as markup.
# - Each role carries its own `stack:` so a tool is named ONCE, next to a dated
#   role (ATS derives "years of experience with X" from that adjacency).
#   Bullets carry impact and metrics; they should not restate tool names.
#   `uv run yaml_to_md.py` warns about any keyword repeated across bullets.

