name: Generate contribution snake

# Generated here rather than in the ashuguptahere/ashuguptahere profile repo,
# so that repo can become a mirror of this one's README without owning any
# build of its own.
on:
  schedule:
    # Every 12 hours, matching the cadence the profile repo used.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Does not touch GitHub Pages: the site deploys from main, while this job only
# writes the generated SVGs to the orphan `output` branch.
permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Render the contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          # The grid belongs to the user, not to this repository.
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
